<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compositor Musical | Espacio Creativo</title>
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07050e;
            --purple-glow: rgba(123, 31, 162, 0.4);
            --neon-pink: #ff007f;
            --neon-pink-glow: rgba(255, 0, 127, 0.5);
            --electric-blue: #00d2ff;
            --electric-blue-hover: #0099ff;
            --soft-blue-glow: rgba(0, 210, 255, 0.6);
            --text-main: #f0f0ff;
            --text-dim: #a0a0c0;
            --red-btn: #e60023;
            --red-btn-hover: #ff1a3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* FONDO GALÁCTICO */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .glow-orb-1 {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, var(--purple-glow) 0%, rgba(7, 5, 14, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
        }

        .glow-orb-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(98, 0, 234, 0.25) 0%, rgba(7, 5, 14, 0) 70%);
            border-radius: 50%;
            filter: blur(80px);
        }

        .neon-line {
            position: absolute;
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink-glow), 0 0 20px var(--neon-pink);
            border-radius: 2px;
            opacity: 0.7;
        }

        .line-1 { top: 15%; left: 8%; width: 60px; height: 2px; transform: rotate(-15deg); }
        .line-2 { top: 45%; right: 12%; width: 45px; height: 2px; transform: rotate(30deg); }
        .line-3 { bottom: 25%; left: 15%; width: 80px; height: 2px; transform: rotate(-5deg); }
        .line-4 { top: 75%; right: 25%; width: 40px; height: 2px; transform: rotate(45deg); }

        /* MENÚ DE NAVEGACIÓN DE 3 RAYAS */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 30px;
            z-index: 100;
        }

        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            z-index: 101;
            position: relative;
        }

        .menu-btn span {
            display: block;
            width: 30px;
            height: 3px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .menu-dropdown {
            position: absolute;
            top: 60px;
            left: 30px;
            background: rgba(15, 10, 30, 0.95);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 8px;
            padding: 15px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(123, 31, 162, 0.3);
            display: none;
            flex-direction: column;
            backdrop-filter: blur(10px);
            min-width: 180px;
        }

        .menu-dropdown.active {
            display: flex;
        }

        .menu-dropdown a {
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .menu-dropdown a:hover {
            background: rgba(255, 0, 127, 0.15);
            color: var(--neon-pink);
            padding-left: 30px;
        }

        /* INICIO */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 4.5vw, 3.5rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, var(--text-dim) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            text-shadow: 0 0 30px rgba(123, 31, 162, 0.5);
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .cta-label {
            font-size: 1.1rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-blue {
            background: linear-gradient(135deg, var(--electric-blue) 0%, var(--electric-blue-hover) 100%);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 16px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-blue:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 35px rgba(0, 210, 255, 0.8);
        }

        /* SECCIONES SECUNDARIAS */
        .section {
            min-height: 80vh;
            padding: 100px 20px 60px;
            max-width: 900px;
            margin: 0 auto;
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            color: var(--electric-blue);
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* DEMOSTRACIONES */
        .tracks-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .track-card {
            background: rgba(20, 15, 35, 0.6);
            border: 1px solid rgba(123, 31, 162, 0.3);
            border-left: 4px solid var(--neon-pink);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .track-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .track-tag {
            font-size: 0.85rem;
            color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 0, 127, 0.3);
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 20px;
        }

        /* SECCIÓN CONTACTO Y LOGOS INTERACTIVOS */
        .contact-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-top: 20px;
        }

        .contact-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .icons-wrapper {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        .icon-btn {
            background: rgba(20, 15, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .icon-btn svg {
            width: 32px;
            height: 32px;
            fill: var(--text-main);
            transition: fill 0.3s ease;
        }

        /* EFECTO SOMBRA/AURA AZUL SUAVE EN HOVER */
        .icon-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px var(--soft-blue-glow);
            border-color: var(--electric-blue);
        }

        .icon-btn:hover svg {
            fill: var(--electric-blue);
        }

        /* DESPLEGABLES DE INFORMACIÓN */
        .info-card {
            display: none;
            background: rgba(20, 15, 35, 0.85);
            border: 1px solid rgba(123, 31, 162, 0.4);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }

        .info-card.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .info-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .btn-red {
            background: var(--red-btn);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 10px 30px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
            box-shadow: 0 0 15px rgba(230, 0, 35, 0.4);
        }

        .btn-red:hover {
            background: var(--red-btn-hover);
            transform: scale(1.05);
        }

        .qr-image {
            width: 200px;
            height: auto;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            margin-top: 5px;
        }

        .email-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--electric-blue);
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- FONDO ESPACIAL -->
    <div class="bg-effects">
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
        <div class="neon-line line-1"></div>
        <div class="neon-line line-2"></div>
        <div class="neon-line line-3"></div>
        <div class="neon-line line-4"></div>
    </div>

    <!-- NAVEGACIÓN -->
    <nav>
        <button class="menu-btn" id="menuBtn" aria-label="Menú">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
            <a href="#" onclick="showSection('inicio')">Inicio</a>
            <a href="#" onclick="showSection('demostraciones')">Demostraciones</a>
            <a href="#" onclick="showSection('contacto')">Contacto</a>
        </div>
    </nav>

    <!-- INICIO -->
    <section id="inicio" class="hero">
        <h1>un espacio para la creación de algo único</h1>
        <div class="cta-container">
            <span class="cta-label">aquí empezaron grandes ideas</span>
            <button class="btn-blue" onclick="showSection('demostraciones')">Demostraciones</button>
        </div>
    </section>

    <!-- DEMOSTRACIONES -->
    <section id="demostraciones" class="section">
        <h2 class="section-title">Demostraciones</h2>
        <div class="tracks-grid">
            
            <!-- Ejemplo de Pista (Sube tu archivo .mp3 a GitHub y pon su nombre aquí) -->
            <div class="track-card">
                <div class="track-info">
                    <span class="track-title">Pista Demo 01</span>
                    <span class="track-tag">Inicio / Muestra</span>
                </div>
                <!-- Cambia "pista1.mp3" por el nombre de tu archivo subido -->
                <audio controls src="pista1.mp3"></audio>
            </div>

        </div>
    </section>

    <!-- CONTACTO -->
    <section id="contacto" class="section">
        <h2 class="section-title">Contacto</h2>
        
        <div class="contact-container">
            <span class="contact-header">contactos:</span>
            
            <div class="icons-wrapper">
                <!-- Icono de Instagram -->
                <div class="icon-btn" onclick="toggleCard('instaCard')" title="Instagram">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                </div>

                <!-- Icono de Correo -->
                <div class="icon-btn" onclick="toggleCard('emailCard')" title="Correo Electrónico">
                    <svg viewBox="0 0 24 24">
                        <path d="M0 3v18h24v-18h-24zm21.518 2l-9.518 7.713-9.518-7.713h19.036zm-19.518 14v-11.817l10 8.104 10-8.104v11.817h-20z"/>
                    </svg>
                </div>
            </div>

            <!-- CARD DESPLEGABLE INSTAGRAM -->
            <div class="info-card" id="instaCard">
                <span class="info-text">contactar por Instagram</span>
                <a href="https://www.instagram.com/ale_xm3l?dlrf=ZmtqZXYxdjdmNXdh" target="_blank" class="btn-red">IR</a>
                <!-- Archivo de la imagen del QR subida a GitHub -->
                <img src="qr-instagram.png" alt="Código QR de Instagram" class="qr-image">
            </div>

            <!-- CARD DESPLEGABLE CORREO -->
            <div class="info-card" id="emailCard">
                <span class="info-text">Correo Electrónico:</span>
                <span class="email-display">Jakkaaa8@gmail.com</span>
            </div>

        </div>
    </section>

    <!-- SCRIPT DE INTERACCIÓN -->
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const menuDropdown = document.getElementById('menuDropdown');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuDropdown.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            menuDropdown.classList.remove('active');
        });

        function showSection(sectionId) {
            const hero = document.getElementById('inicio');
            if(sectionId === 'inicio') {
                hero.style.display = 'flex';
            } else {
                hero.style.display = 'none';
            }

            const sections = document.querySelectorAll('.section');
            sections.forEach(sec => sec.classList.remove('active'));

            if(sectionId !== 'inicio') {
                const activeSection = document.getElementById(sectionId);
                if(activeSection) activeSection.classList.add('active');
            }

            menuDropdown.classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Alternar información desplegable en contacto
        function toggleCard(cardId) {
            const instaCard = document.getElementById('instaCard');
            const emailCard = document.getElementById('emailCard');

            if(cardId === 'instaCard') {
                emailCard.classList.remove('active');
                instaCard.classList.toggle('active');
            } else if(cardId === 'emailCard') {
                instaCard.classList.remove('active');
                emailCard.classList.toggle('active');
            }
        }
    </script>
</body>
</html>
